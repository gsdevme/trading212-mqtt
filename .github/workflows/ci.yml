name: ci

# Pull-request gate: the full verification suite plus a build-only Docker
# validation (no push) to catch Dockerfile breakage before merge.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Native amd64 only. The multi-arch build happens on release; the emulated
      # arm64 leg is slow and adds little signal for a static CGO_ENABLED=0 build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
